<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VaultBNB Store</title><style>:root{--bg:#070a0e;--card:#10141b;--border:#1d232f;--green:#1aff6c;--text:#e8eef6;--muted:#8a94a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter}.wrap{max-width:1100px;margin:0 auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);background:var(--card);border-radius:14px}.btn{background:var(--green);color:#000;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;width:100%}.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}.muted{color:var(--muted)}</style></head><body><div class="wrap"><div class="nav"><div><b>VAULTBNB</b> <span style="color:var(--green)">STORE</span></div><div style="display:flex;gap:8px"><button class="btn-ghost" onclick="navigator.clipboard.writeText('https://vaultbnb.com/?ref=VOULT8X92');alert('Referral copied!')">Share</button><button class="btn-ghost" onclick="login()">Login</button><button class="btn" style="width:auto" onclick="login()">Sign Up</button></div></div><div class="card"><h2>Store Files — Encrypted $0.005/GB</h2><div id="tiers" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0"></div><div style="display:flex;gap:8px;margin-bottom:10px"><input value="VOULT8X92" style="flex:1;background:#0b1017;border:1px solid #1d232f;color:#e8eef6;border-radius:10px;padding:10px"/><span style="color:#1aff6c">-10% applied</span></div><button class="btn" onclick="pay()">Pay for Storage — <span id="price">$5/mo</span> — Add Card</button></div><div style="text-align:center;margin-top:20px"><a href="/" class="muted">← Back</a> • <a href="/host" class="muted">Host → Earn</a></div></div><script>let sel=1000,price=5;let tiers=[{gb:100,p:0.5},{gb:1000,p:5},{gb:10000,p:50},{gb:500000,p:2500}];function render(){document.getElementById('tiers').innerHTML=tiers.map(t=>`<div onclick="sel=${t.gb};price=${t.p};render()" style="border:1px solid ${sel==t.gb?'#1aff6c':'#1d232f'};border-radius:12px;padding:12px;cursor:pointer"><b>${t.gb>=1000?t.gb/1000+'TB':t.gb+'GB'}</b><div class=muted>$${t.p}/mo</div></div>`).join('');document.getElementById('price').textContent='$'+price+'/mo'}function login(){let e=prompt('Email:');if(e)alert('Logged in '+e)}function pay(){alert('Stripe: $'+price+' for '+sel+'GB')}render();</script></body></html>
