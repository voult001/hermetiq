<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VaultBNB Host</title><style>:root{--bg:#070a0e;--card:#10141b;--border:#1d232f;--green:#1aff6c;--text:#e8eef6;--muted:#8a94a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui}.wrap{max-width:1100px;margin:0 auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);background:var(--card);border-radius:14px}.btn{background:var(--green);color:#000;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.muted{color:var(--muted)}</style></head><body><div class="wrap"><div class="nav"><div><b>VAULTBNB</b> <span style="color:var(--green)">HOST</span></div><div style="display:flex;gap:8px"><button class="btn-ghost" onclick="navigator.clipboard.writeText('https://vaultbnb.com/?ref=VOULT8X92');alert('Share link copied!')">Share</button><button class="btn-ghost" onclick="login()">Log In</button><button class="btn" onclick="login()">Sign Up</button></div></div><div class="grid"><div><div class="card"><h2>Rent Your Spare Drive</h2><div class="muted">Earn 80% - $0.004/GB</div><div id="tiers" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0"></div><button class="btn" id="shareBtn" style="width:100%">Start Sharing</button><div id="status" class="muted" style="margin-top:8px">Sign up to start</div></div><div class="card" style="border-color:var(--green)"><h2>Referral $5 per friend</h2><div style="display:flex;gap:8px"><input id="ref" value="https://vaultbnb.com/?ref=VOULT8X92" readonly style="flex:1;background:#0b1017;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px"/><button class="btn" onclick="navigator.clipboard.writeText(ref.value)">Copy</button></div><div class="muted">Code: VOULT8X92 - 3 invited - $15 earned</div><button class="btn-ghost" style="width:100%;margin-top:8px" onclick="alert('Withdrew $15')">Withdraw Referral</button></div></div><div><div class="card"><h2>Earnings</h2><div style="font-size:36px;font-weight:800;color:var(--green)" id="bal">$0.00</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="addCard()">+ Add Payout Card</button><button class="btn-ghost" onclick="withdraw()">Withdraw</button></div><div id="card" class="muted" style="margin-top:8px">No card yet</div></div></div></div><div style="text-align:center;margin-top:20px"><a href="/" class="muted">Back</a></div></div><script>let sel=1000,bal=0,card=null;let tiers=[{gb:100},{gb:500},{gb:1000},{gb:5000}];function render(){document.getElementById('tiers').innerHTML=tiers.map(t=>`<div onclick="sel=${t.gb};render()" style="border:1px solid ${sel==t.gb?'#1aff6c':'#1d232f'};border-radius:12px;padding:10px;cursor:pointer"><b>${t.gb>=1000?t.gb/1000+'TB':t.gb+'GB'}</b><div class=muted style=font-size:11px>$${(t.gb*0.004).toFixed(2)}/mo</div></div>`).join('');document.getElementById('shareBtn').textContent=`Start Sharing ${sel>=1000?sel/1000+'TB':sel+'GB'} - $${(sel*0.004).toFixed(2)}/mo`}function login(){let e=prompt('Email:');if(e){alert('Logged in '+e)}}function addCard(){let c=prompt('Payout card:','Chase ****4242');if(c){card=c;document.getElementById('card').innerHTML='Payout: <b>'+c+'</b>'}}function withdraw(){if(!card){addCard();return}if(bal<1)bal=4.20;alert('Withdrew $'+bal.toFixed(2)+' to '+card);bal=0;document.getElementById('bal').textContent='$0.00'}document.getElementById('shareBtn').onclick=()=>{bal+=sel*0.004;document.getElementById('bal').textContent='$'+bal.toFixed(2);document.getElementById('status').innerHTML='<span style=color:#1aff6c>Sharing '+sel+'GB</span>'};render();</script></body></html>
